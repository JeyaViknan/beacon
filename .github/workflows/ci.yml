# CI: runs on pull requests and branch pushes, and is reused by deploy.yml before every deploy.
# Actions are pinned to commit SHAs (tag shown in the comment) so a moved tag cannot change
# what runs in this pipeline.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main is covered by deploy.yml, which calls this workflow
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  TERRAFORM_VERSION: "1.17.0"

jobs:
  python:
    name: Python lint + tests (85% coverage gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            requirements-dev.txt
            services/requirements/*.txt
      - name: Install dependencies
        run: |
          uv venv .venv --python "$PYTHON_VERSION"
          uv pip install --python .venv/bin/python -r requirements-dev.txt
      - run: make lint
      - run: make test

  web:
    name: Web typecheck, lint, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - run: terraform fmt -check -recursive infra
      - name: Validate every stack
        run: |
          for dir in infra/bootstrap infra/modules/probe infra/main; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  lambda-packages:
    name: Lambda zips import on python3.12/arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: services/requirements/*.txt
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Build zips
        run: PYTHON=python3 ./scripts/build_lambdas.sh
      - name: Import every handler inside the AWS Lambda image
        run: ./scripts/smoke_lambda_imports.sh
